n_splits: 5
n_repeats: 5
seed: 42
val_frac: 0.2

xgb:
  n_estimators: 300
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 4
  reg_lambda: 1.0
  early_stopping_rounds: 40

mlp:
  hidden: [64, 32]
  dropout: 0.3
  epochs: 80
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  patience: 12

gcn:
  hidden_channels: 32
  num_layers: 2
  dropout: 0.3
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  patience: 15

gat:
  hidden_channels: 16
  heads: 4
  num_layers: 2
  dropout: 0.3
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  patience: 15
